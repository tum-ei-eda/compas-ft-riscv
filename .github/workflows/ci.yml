name: Build LLVM and patch LLVM with COMPAS

on:
  push:
    paths-ignore:
    - docs/**
    - README*
    branches:
      - main
    tags:
      - v*
  pull_request:
    paths-ignore:
    - docs/**
    - README*
    branches:
      - main
  workflow_dispatch: {}

env:
  BUILD_TYPE: Release
  LLVM_INSTALL_DIR: ${{ github.workspace }}/llvm_install
  RVGNU_INSTALL_DIR: ${{ github.workspace }}/rvgnu_install

defaults:
  run:
    shell: bash

jobs:
  build_llvm_compas:
    strategy:
      matrix:
        os:
          - { name: "ubuntu", version: "24.04" }
        llvm:
          #- { src: 'true', tag: '13.0.1' } # <-- the original config
          #- { src: 'true', tag: '14.0.6' } # <-- save CI time
          #- { src: 'true', tag: '15.0.7' } # <-- save CI time
          - { src: 'true', tag: '16.0.6' } # <-- latest (supported) llvm
        llvm_base:
          - { url: "https://github.com/llvm/llvm-project.git", prefix: "llvm-project" }

    runs-on: ${{ matrix.os.name }}-${{ matrix.os.version }}
    name: build_${{ matrix.os.name }}-${{ matrix.os.version }}_compas_llvm${{ matrix.llvm.tag }}

    steps:
    - name: Clone COMPAS
      uses: actions/checkout@v4
      with:
        path: compas-ft-riscv_src
        submodules: recursive
    - name: Load env vars from docker/.env
      run: |
        while IFS='=' read -r key value || [ -n "$key" ]; do
          [[ -z "$key" || "$key" == \#* ]] && continue
          key="$(echo "$key" | xargs)"
          value="$(echo "$value" | xargs)"
          value="${value%\"}"
          value="${value#\"}"
          echo "$key=$value" >> $GITHUB_ENV
        done < compas-ft-riscv_src/docker/.env
        echo "ENV_LLVM_VERSION=llvmorg-${{ matrix.llvm.tag }}" >> $GITHUB_ENV
    - name: Requirements (Linux)
      working-directory: ${{ github.workspace }}
      continue-on-error: false
      shell: bash
      run: |
        sudo bash -c '. "$1"; setup_env' -- \
          "$GITHUB_WORKSPACE/compas-ft-riscv_src/docker/setup_debian.sh"
    - name: Set up compiler cache
      uses: hendrikmuhs/ccache-action@v1
      with:
        variant: sccache
        max-size: 2G
        key: llvm-native-${{ matrix.os.name }}-${{ matrix.os.version }}-${{ matrix.llvm.tag }}-${{ env.ENV_BUILD_CONFIG }}-cxx${{ env.ENV_BUILD_CXX_STANDARD }}
    - name: Clone LLVM
      working-directory: ${{ github.workspace }}
      run: |
        . ./compas-ft-riscv_src/docker/setup_debian.sh
        fetch_llvm "${{ github.workspace }}/../llvm_src" \
                   "${{ github.workspace }}/../llvm_build" \
                   "$LLVM_INSTALL_DIR" \
                   "${{ env.ENV_LLVM_VERSION }}"
    - name: Patch (LLVM base build)
      working-directory: ${{ github.workspace }}
      run: |
        . ./compas-ft-riscv_src/docker/setup_debian.sh
        patch_llvm "${{ github.workspace }}/../llvm_src" \
                   "${{ github.workspace }}/../llvm_build" \
                   "$LLVM_INSTALL_DIR" \
                   "${{ env.ENV_LLVM_VERSION }}" \
                   "${GITHUB_WORKSPACE}/compas-ft-riscv_src/patches/"
        setup_compas "${GITHUB_WORKSPACE}/compas-ft-riscv_src" \
                     "${{ github.workspace }}/../llvm_src"
    - name: Configure LLVM (base build)
      working-directory: ${{ github.workspace }}
      env:
        COMPAS_COMPILER_LAUNCHER: sccache
      run: |
        . ./compas-ft-riscv_src/docker/setup_debian.sh
        configure_llvm "${{ github.workspace }}/../llvm_src" \
                   "${{ github.workspace }}/../llvm_build" \
                   "$LLVM_INSTALL_DIR" \
                   "${{ env.ENV_LLVM_VERSION }}"
    - name: Compile LLVM with COMPAS
      working-directory: ${{ github.workspace }}
      run: |
        . ./compas-ft-riscv_src/docker/setup_debian.sh
        build_llvm "${{ github.workspace }}/../llvm_src" \
                   "${{ github.workspace }}/../llvm_build" \
                   "$LLVM_INSTALL_DIR" \
                   "${{ env.ENV_LLVM_VERSION }}"
    - name: Install LLVM
      working-directory: ${{ github.workspace }}
      run: |
        . ./compas-ft-riscv_src/docker/setup_debian.sh
        install_llvm "${{ github.workspace }}/../llvm_src" \
                   "${{ github.workspace }}/../llvm_build" \
                   "$LLVM_INSTALL_DIR" \
                   "${{ env.ENV_LLVM_VERSION }}"
    - name: Upload pre-built LLVM w/ Compas Patch
      uses: actions/upload-artifact@v5
      with:
        name: prebuilt_${{ matrix.os.name }}-${{ matrix.os.version }}_compas_llvm${{ matrix.llvm.tag }}
        path: ${{ env.LLVM_INSTALL_DIR }}

  prepare_testenv:
    strategy:
      matrix:
        os:
          - { name: "ubuntu", version: "24.04" }
        rvgnu:
          - { url: "https://github.com/xpack-dev-tools/riscv-none-elf-gcc-xpack/releases/download/v13.2.0-2/xpack-riscv-none-elf-gcc-13.2.0-2-linux-x64.tar.gz", prefix: "xpack-riscv-none-elf-gcc-13.2.0-2" }

    runs-on: ${{ matrix.os.name }}-${{ matrix.os.version }}
    name: prepare_testenv_${{ matrix.os.name }}-${{ matrix.os.version }}_rvgnu

    steps:
    - name: Clone COMPAS
      uses: actions/checkout@v4
      with:
        path: compas-ft-riscv_src
    - name: Requirements (Linux)
      working-directory: ${{ github.workspace }}/compas-ft-riscv_src
      continue-on-error: false
      shell: bash
      run: |
        sudo bash -c '. "$1"; setup_testenv' -- \
          "$GITHUB_WORKSPACE/compas-ft-riscv_src/docker/setup_debian.sh"
    - name: RISCV GNU Tools
      id: cache-rvgnu
      uses: actions/cache@v4
      with:
        path: ${{ env.RVGNU_INSTALL_DIR }}
        key: rvgnu-native-${{ matrix.os.name }}-${{ matrix.os.version }}_${{ matrix.rvgnu.prefix }}
    - if: ${{ steps.cache-rvgnu.outputs.cache-hit != 'true' }}
      name: Requirements RVGNU
      working-directory: ${{ github.workspace }}/compas-ft-riscv_src
      shell: bash
      run: |
        . docker/setup_debian.sh
        fetch_rvgnu "$RVGNU_INSTALL_DIR" "${{ matrix.rvgnu.url }}" "${{ matrix.rvgnu.prefix }}"
        configure_rvgnu "$RVGNU_INSTALL_DIR"
        build_rvgnu
        install_rvgnu
        cleanup_rvgnu

  test_compas:
    strategy:
      fail-fast: false
      matrix:
        os:
          - { name: "ubuntu", version: "24.04" }
        llvm:
          #- { src: 'true', tag: '13.0.1' } # <-- the original config
          #- { src: 'true', tag: '14.0.6' } # <-- save CI time
          #- { src: 'true', tag: '15.0.7' } # <-- save CI time
          - { src: 'true', tag: '16.0.6' } # <-- latest (supported) llvm
        rvgnu:
          - { base: "riscv-none-elf", prefix: "xpack-riscv-none-elf-gcc-13.2.0-2" }
        suts:
          - { name: "crc", funcs: ["", "main", "crcInit", "crcSlow", "crcFast", 
                                   "main,crcInit", "main,crcSlow", "main,crcFast", 
                                   "crcInit,crcSlow", "crcInit,crcFast", "crcSlow,crcFast",
                                   "crcInit,crcSlow,crcFast", "main,crcSlow,crcFast", 
                                   "main,crcInit,crcSlow,crcFast"] }
        isa:
          - { name: "rv64gc", arch: "rv64" }
        dmr:
          - { trafo: ""}
          - { trafo: "EDDI" }
          - { trafo: "SWIFT" }
          - { trafo: "NZDC" }
          - { trafo: "NZDC+NEMESIS" }
          - { trafo: "NZDC+NEMESEC" }
        cfp:
          - { trafo: "" }
          - { trafo: "CFCSS" }
          - { trafo: "RASM" }
          - { trafo: "RACFED" }

    runs-on: ${{ matrix.os.name }}-${{ matrix.os.version }}
    name: test_${{ matrix.suts.name }}_${{ matrix.dmr.trafo }}-${{ matrix.cfp.trafo }}
    needs: [build_llvm_compas, prepare_testenv]
 
    steps:
    - name: Clone COMPAS
      uses: actions/checkout@v4
      with:
        path: compas-ft-riscv_src
    - name: Requirements (Linux)
      working-directory: ${{ github.workspace }}/compas-ft-riscv_src
      shell: bash
      run: |
        sudo bash -c '. "$1"; setup_testenv' -- \
          "$GITHUB_WORKSPACE/compas-ft-riscv_src/docker/setup_debian.sh"
    - name: Fetch Compiled LLVM+Compas
      uses: actions/download-artifact@v5
      with:
        name: prebuilt_${{ matrix.os.name }}-${{ matrix.os.version }}_compas_llvm${{ matrix.llvm.tag }} 
        path: ${{ env.LLVM_INSTALL_DIR }}
    - name: RISCV GNU Tools
      id: cache-rvgnu
      uses: actions/cache/restore@v4
      with:
        path: ${{ env.RVGNU_INSTALL_DIR }}
        key: rvgnu-native-${{ matrix.os.name }}-${{ matrix.os.version }}_${{ matrix.rvgnu.prefix }}
        fail-on-cache-miss: true
    - name: Prepare tools
      shell: bash
      run: |
        chmod -R +x "$RVGNU_INSTALL_DIR/bin"
        chmod -R +x "$LLVM_INSTALL_DIR/bin"
    - name: Check application equivalence
      working-directory: ${{ github.workspace }}/compas-ft-riscv_src
      continue-on-error: false
      shell: bash
      run: |
        set -euo pipefail
        FUNCS_JSON='${{ toJson(matrix.suts.funcs) }}'
        mapfile -t FUNCS < <(jq -r '.[]' <<<"$FUNCS_JSON" | tr -d '\r')
        mode='${{ matrix.dmr.trafo }}'
        cfp='${{ matrix.cfp.trafo }}'
        mode="${mode:-none}"
        cfp="${cfp:-none}"
        status=0
        for funcs in "${FUNCS[@]}"; do
          selection="${funcs//,/_}"
          build_dir="${GITHUB_WORKSPACE}/build/apps/${{ matrix.suts.name }}/${mode}-${cfp}/${selection:-none}"
          python3 tests/apps/run.py \
            --case '${{ matrix.suts.name }}/*' --arch "${{ matrix.isa.arch }}" \
            --mode "$mode" --cfp "$cfp" \
            --functions "$funcs" --cfp-functions "$funcs" \
            --llvm-root "$LLVM_INSTALL_DIR" \
            --clang "$LLVM_INSTALL_DIR/bin/clang" --llc "$LLVM_INSTALL_DIR/bin/llc" \
            --riscv-prefix "$RVGNU_INSTALL_DIR" \
            --riscv-basename "${{ matrix.rvgnu.base }}" \
            --spike "$RVGNU_INSTALL_DIR/bin/spike" \
            --pk "$RVGNU_INSTALL_DIR/${{ matrix.rvgnu.base }}/bin/pk" \
            --build-dir "$build_dir" || status=1
        done
        exit "$status"
    - name: Upload application logs and summaries
      if: always()
      uses: actions/upload-artifact@v5
      with:
        name: apps_${{ matrix.os.name }}-${{ matrix.os.version }}_llvm${{ matrix.llvm.tag }}_${{ matrix.suts.name }}_${{ matrix.dmr.trafo || 'none' }}-${{ matrix.cfp.trafo || 'none' }}
        path: ${{ github.workspace }}/build/apps
        if-no-files-found: ignore

  regression_compas:
    strategy:
      fail-fast: false
      matrix:
        os:
          - { name: "ubuntu", version: "24.04" }
        llvm:
          - { tag: "16.0.6" }
        rvgnu:
          - { base: "riscv-none-elf", prefix: "xpack-riscv-none-elf-gcc-13.2.0-2" }
        arch:
          - { name: "rv32", bits: "32" }
          - { name: "rv64", bits: "64" }

    runs-on: ${{ matrix.os.name }}-${{ matrix.os.version }}
    name: regression_${{ matrix.arch.name }}
    needs: [build_llvm_compas, prepare_testenv]

    steps:
    - name: Clone COMPAS
      uses: actions/checkout@v4
      with:
        path: compas-ft-riscv_src
    - name: Install runtime dependencies
      run: |
        sudo apt-get -o Acquire::Retries=5 -o APT::Update::Error-Mode=any update
        sudo apt-get -o Acquire::Retries=5 install --no-install-recommends -y python3 qemu-user
    - name: Fetch compiled LLVM with COMPAS
      uses: actions/download-artifact@v5
      with:
        name: prebuilt_${{ matrix.os.name }}-${{ matrix.os.version }}_compas_llvm${{ matrix.llvm.tag }}
        path: ${{ env.LLVM_INSTALL_DIR }}
    - name: Restore RISC-V GNU tools
      uses: actions/cache/restore@v4
      with:
        path: ${{ env.RVGNU_INSTALL_DIR }}
        key: rvgnu-native-${{ matrix.os.name }}-${{ matrix.os.version }}_${{ matrix.rvgnu.prefix }}
        fail-on-cache-miss: true
    - name: Prepare tools
      run: |
        chmod -R +x "$LLVM_INSTALL_DIR/bin"
        chmod -R +x "$RVGNU_INSTALL_DIR/bin"
    - name: Check fault-free regression equivalence
      working-directory: ${{ github.workspace }}/compas-ft-riscv_src
      run: |
        python3 tests/regression/run.py \
          --clang "$LLVM_INSTALL_DIR/bin/clang" --llc "$LLVM_INSTALL_DIR/bin/llc" \
          --cc "$RVGNU_INSTALL_DIR/bin/${{ matrix.rvgnu.base }}-gcc" \
          --qemu "qemu-riscv${{ matrix.arch.bits }}" \
          --arch "${{ matrix.arch.name }}" \
          --build-dir "${GITHUB_WORKSPACE}/build/regression/${{ matrix.arch.name }}"
    - name: Check late preservation with large fixed areas
      working-directory: ${{ github.workspace }}/compas-ft-riscv_src
      run: |
        python3 tests/regression/late_codegen/run.py \
          --clang "$LLVM_INSTALL_DIR/bin/clang" --llc "$LLVM_INSTALL_DIR/bin/llc" \
          --cc "$RVGNU_INSTALL_DIR/bin/${{ matrix.rvgnu.base }}-gcc" \
          --qemu "qemu-riscv${{ matrix.arch.bits }}" \
          --arch "${{ matrix.arch.name }}" \
          --build-dir "${GITHUB_WORKSPACE}/build/regression/late_codegen/${{ matrix.arch.name }}"
    - name: Check shadow call and memory metadata
      working-directory: ${{ github.workspace }}/compas-ft-riscv_src
      run: |
        python3 tests/regression/machine_metadata/run.py \
          --clang "$LLVM_INSTALL_DIR/bin/clang" --llc "$LLVM_INSTALL_DIR/bin/llc" \
          --cc "$RVGNU_INSTALL_DIR/bin/${{ matrix.rvgnu.base }}-gcc" \
          --qemu "qemu-riscv${{ matrix.arch.bits }}" \
          --arch "${{ matrix.arch.name }}" \
          --build-dir "${GITHUB_WORKSPACE}/build/regression/machine_metadata/${{ matrix.arch.name }}"
    - name: Upload regression logs and summaries
      if: always()
      uses: actions/upload-artifact@v5
      with:
        name: regression_${{ matrix.os.name }}-${{ matrix.os.version }}_llvm${{ matrix.llvm.tag }}_${{ matrix.arch.name }}
        path: ${{ github.workspace }}/build/regression
        if-no-files-found: ignore
