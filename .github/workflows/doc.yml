name: Build COMPAS Manual and GitHub Pages

on:
  push:
    branches:
      - main
    tags:
      - v*
    paths:
      - README.md
      - docs/**
      - docker/.env
      - .github/workflows/doc.yml
  pull_request:
    paths:
      - README.md
      - docs/**
      - docker/.env
      - .github/workflows/doc.yml
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: github-pages-${{ github.event.pull_request.number || 'deploy' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build_manual:
    name: Build project site and manual
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install documentation tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            latexmk texlive-latex-extra texlive-fonts-recommended pandoc poppler-utils python3
      - name: Build manual and Pages site
        run: sh docs/manual/generate.sh "$GITHUB_WORKSPACE/build/manual/site"
      - name: Check site links and assets
        run: python3 docs/manual/check_links.py build/manual/site
      - name: Upload Pages site
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/manual/site

  deploy_pages:
    name: Deploy GitHub Pages
    if: github.event_name != 'pull_request'
    needs: build_manual
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
