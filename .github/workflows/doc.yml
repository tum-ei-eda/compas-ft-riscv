name: Build COMPAS Manual and GitHub Pages

on:
  push:
    tags:
      - v*
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build_manual:
    name: Build PDF and HTML manual
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install documentation tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            latexmk texlive-latex-extra texlive-fonts-recommended pandoc poppler-utils
      - name: Build manual and Pages site
        run: sh docs/manual/generate.sh "$GITHUB_WORKSPACE/build/manual/site"
      - name: Upload Pages site
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/manual/site

  deploy_pages:
    name: Deploy GitHub Pages
    needs: build_manual
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
